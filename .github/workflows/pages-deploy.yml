name: Deploy Pages

# Only a commit that passed CI on main deploys; a push alone never reaches production.
on:
  # Runs main's copy of this file; it checks out a commit on main that CI passed, never a pull request's code.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Read-only by default: `pages: write` and `id-token: write` at the top would reach the jobs that install and run npm packages.
permissions:
  contents: read

# Queued, never cancelled; a run for a commit main has already moved past gets its own group so it cannot displace the queued deploy.
concurrency:
  group: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.head_sha == github.sha) && 'pages' || format('pages-superseded-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # CI finishes out of order and can be re-run, so only main's current tip deploys; a dispatch deploys it only if CI passed on it.
  gate:
    if: >-
      github.ref == 'refs/heads/main' && (
        github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
          github.event.workflow_run.head_repository.full_name == github.repository
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read # CI's runs of the commit, on a dispatch
      contents: read # main's current tip
      pages: read # the site's URL, custom domain included
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      pages-url: ${{ steps.pages.outputs.base_url }}
    steps:
      - name: Pick the commit to deploy
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          # The jobs below check out github.sha (main when this run started), so CI's commit must be exactly that one.
          COMMIT: ${{ github.sha }}
          CI_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$CI_COMMIT" != "$COMMIT" ] || [ "$COMMIT" != "$tip" ]; then
            echo "::notice::Skipped: $CI_COMMIT is no longer main's tip ($tip), which deploys once CI passes on it."
            exit 0
          fi
          if [ "$EVENT_NAME" != workflow_run ]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$COMMIT&status=success" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | length')
            if [ "$passed" = 0 ]; then
              echo "::error::CI has not passed on $COMMIT; nothing deploys."
              exit 1
            fi
          fi
          echo "sha=$COMMIT" >> "$GITHUB_OUTPUT"

      # The build's base path follows the Pages settings, so a custom domain needs no code change.
      - name: Read the Pages site URL
        id: pages
        if: steps.commit.outputs.sha != ''
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

  build:
    needs: gate
    if: needs.gate.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      PAGES_BASE_URL: ${{ needs.gate.outputs.pages-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - run: npm run build
      - run: test -d out && test -f out/index.html
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/out

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The browser suite against the live origin: Node prerendering masks failures only the browser bundle shows. It writes nothing outside the browser.
  smoke_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, deploy]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-web

      - run: npx playwright install --with-deps chromium firefox
      # Through env, not the command line: `${{ }}` substitutes before the shell parses. E2E_BASE_URL also stops the config starting its own server.
      - run: npm run e2e
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.page_url }}

      - name: Keep the report from a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-production
          path: web/playwright-report
          retention-days: 7
